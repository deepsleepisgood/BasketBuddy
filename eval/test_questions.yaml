# BasketBuddy evaluation set (Phase 8).
#
# questions: run end to end through rag.pipeline.answer().
#   evidence_keywords: the answer is supported if ANY keyword appears (case-insensitive) in the
#                      names of the retrieved products (cart lines / catalogue products).
#   expect_fallback:   true for questions the bot must refuse.
#   expect_sub_categories / forbid_sub_categories: category checks on the retrieved products.
#   confirmed_items:   for AI-suggested lists, the items the user keeps (simulates the tick boxes).
#   mode / servings:   what the sidebar would send (null = message decides).
#
# ablation: labelled sub-queries for the retrieval ablation. A top-5 hit counts as relevant when
#   its sub-category is in `sub_categories` AND (if given) its name contains one of `name_any`.
#
# threshold_probe: catalogue-style questions with no answer in the catalogue (`off`) vs ones
#   that have one (`on`), to re-check SIM_THRESHOLD.

questions:
  - id: Q1
    type: factual
    question: "What is the price of Fortune sunflower refined oil 1 L?"
    evidence_keywords: [sunflower, sun lite, sunlite]
    expect_fallback: false

  - id: Q2
    type: comparison
    question: "Compare Aashirvaad and Pillsbury whole wheat atta 5 kg on price and rating."
    evidence_keywords: [atta]
    expect_fallback: false

  - id: Q3
    type: multi-part
    question: "Give me everything I need for dal makhani for 4 people, budget mode, I already have salt and ghee."
    evidence_keywords: [urad, rajma, butter, cream]
    expect_fallback: false
    expect_excluded: [salt]

  - id: Q4
    type: pasted recipe
    question: "Quick poha: 2 cups poha, 1 onion chopped, 1/2 tsp mustard seeds, 8-10 curry leaves, 1 green chilli, 1/4 tsp haldi, salt to taste, 1 tbsp oil, lemon juice and peanuts."
    evidence_keywords: [poha, mustard, peanut, curry leaves]
    expect_fallback: false

  - id: Q5
    type: hinglish
    question: "jeera aur haldi kitne ka hai?"
    evidence_keywords: [jeera, cumin, haldi, turmeric]
    expect_fallback: false

  - id: Q6
    type: need → cart (non-food)
    question: "I need to deep-clean my bathroom this weekend."
    evidence_keywords: [toilet, bathroom, cleaner, brush]
    expect_fallback: false
    forbid_sub_categories: [Skin Care]

  - id: Q7
    type: need → cart (non-food)
    question: "Skincare routine for oily skin under ₹1000."
    evidence_keywords: [face wash, facewash, moistur, sunscreen, toner]
    expect_fallback: false
    expect_budget_fits: true

  - id: Q8
    type: cross-category
    question: "coconut oil for hair"
    evidence_keywords: [coconut]
    expect_fallback: false
    expect_sub_categories: [Hair Care]

  - id: Q9
    type: cross-category
    question: "coconut oil for cooking"
    evidence_keywords: [coconut]
    expect_fallback: false
    expect_sub_categories: [Edible Oils & Ghee, Oils & Vinegar, Organic Staples]

  - id: Q10
    type: cross-category
    question: "Cheapest floor cleaner"
    evidence_keywords: [floor]
    expect_fallback: false
    forbid_sub_categories: [Skin Care]

  - id: Q11
    type: non-food comparison
    question: "Compare Dove and Pears bathing soaps on price and rating."
    evidence_keywords: [dove, pears, bathing bar, soap]
    expect_fallback: false

  - id: Q12
    type: unsupported
    question: "Is paneer in stock in Koramangala right now?"
    evidence_keywords: []
    expect_fallback: true

  - id: Q13
    type: unsupported
    question: "Is Blinkit cheaper than BigBasket?"
    evidence_keywords: []
    expect_fallback: true

  # --- extra cases beyond the brief's minimum ---------------------------------------
  - id: Q14
    type: unsupported (off-catalogue)
    question: "best laptop under 50000"
    evidence_keywords: []
    expect_fallback: true

  - id: Q15
    type: need → AI list (confirmed)
    question: "I'm getting a pet tortoise, what should I buy?"
    evidence_keywords: [pet, wipes]
    expect_fallback: false
    confirmed_items_first: 10     # keep every suggested item (a user who accepts the list)

  - id: Q16
    type: dish (sidebar servings)
    question: "paneer butter masala"
    servings: 6
    mode: Top rated
    evidence_keywords: [paneer, butter, cream]
    expect_fallback: false

  # --- added after manual testing (conversational phrasing, recommendation questions) ---
  - id: Q17
    type: dish (conversational)
    question: "i need to cook butter chicken for 5 ppl"
    evidence_keywords: [chicken, butter, cream]
    expect_fallback: false

  - id: Q18
    type: recommendation (personal care)
    question: "my skin is oily, what cleanser should i use"
    evidence_keywords: [cleanser, face wash, facewash]
    expect_fallback: false
    expect_sub_categories: [Skin Care, Men's Grooming]

